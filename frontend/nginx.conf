server {
  listen 80;
  server_name _;
  client_max_body_size 6m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /media/ { alias /srv/media/; }
  location /static/ { alias /srv/static/; }
  location / { try_files $uri $uri/ /index.html; }
}
